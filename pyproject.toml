[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "alpr-dataset"
version = "1.0.0"
description = "Dataset engineering pipeline for Egyptian ALPR (license plate) datasets."
requires-python = ">=3.12"

[tool.setuptools.packages.find]
where = ["src"]
