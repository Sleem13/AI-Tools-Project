# Vehicle -> license plate cascade. Paths are relative to the project root.

vehicle:
  weights: yolo11n.pt             # COCO-pretrained YOLO11; auto-downloads
  conf_threshold: 0.30
  iou_threshold: 0.45
  class_ids: [2, 3, 5, 7]         # COCO: car, motorcycle, bus, truck
  max_detections: 100

plate:
  weights: models/detection/master_plate_yolo11/weights/best.pt
  conf_threshold: 0.25
  iou_threshold: 0.45
  max_detections: 20

cascade:
  vehicle_padding: 0.05
  plate_nms_iou: 0.50
  fallback_to_full_image: false

# Stage three is activated automatically by the API when trained weights exist.
character:
  enabled: true
  model_family: yolo26
  auto_select: false
  # Promoted after real-plate comparison: recovers the complete seven-character
  # layout where the older finalized checkpoint drops multiple characters.
  weights: models/character/yolo26_characters_20260727_152325/weights/best.pt
  conf_threshold: 0.15
  iou_threshold: 0.45
  agnostic_nms: false
  max_detections: 12
  reading_direction: rtl
  row_threshold: 0.60
  preprocess:
    enabled: true
    upscale_factor: 2
    min_dim: 32
    target_height: 128
    clahe: true
    clahe_clip_limit: 2.0
    clahe_tile_grid_size: 8
    sharpen: false
    sharpen_amount: 0.4
    rotation_variants: true
    rotation_variant_min_aspect: 1.15
    # Landscape plates can be clear but still tilted several degrees. Preserve
    # the rectified crop and try small rotations, selecting the strongest read.
    deskew_angles: [-8, -4, 4, 8]
    # Retry below the normal confidence threshold until a full 3-letter/4-digit
    # plate can be considered; six-character plates remain valid downstream.
    retry_min_characters: 7
    retry_conf_threshold: 0.05
