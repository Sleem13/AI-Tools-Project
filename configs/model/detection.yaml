# YOLOv8 detection model configuration for ALPR license plate detection.
# 
# This config is consumed by scripts/train_detection.py.
# All paths are relative to the project root unless absolute.

model:
  name: yolov8n                        # variant: yolov8n / yolov8s / yolov8m / yolov8l / yolov8x
  pretrained: true                     # start from COCO-pretrained weights

data:
  dataset_yaml: configs/model/dataset.yaml   # generated on-the-fly by training script
  train_split: reports/splits/train.txt
  val_split: reports/splits/val.txt
  test_split: reports/splits/test.txt
  unified_root: data/processed/unified
  preprocessed_root: data/processed/preprocessed
  use_preprocessed: true               # use preprocessed images if available, else unified

hyperparameters:
  epochs: 100
  batch: 16
  imgsz: 640
  optimizer: AdamW
  lr0: 0.001
  lrf: 0.01
  momentum: 0.937
  weight_decay: 0.0005
  warmup_epochs: 3
  warmup_momentum: 0.8
  warmup_bias_lr: 0.1
  box: 7.5
  cls: 0.5
  dfl: 1.5
  hsv_h: 0.015
  hsv_s: 0.7
  hsv_v: 0.4
  degrees: 0.0
  translate: 0.1
  scale: 0.5
  shear: 0.0
  perspective: 0.0
  flipud: 0.0
  fliplr: 0.5
  mosaic: 1.0
  mixup: 0.0
  copy_paste: 0.0

training:
  device: 0                            # GPU id, or "cpu"
  workers: 4
  project: models/detection
  name: exp
  exist_ok: false
  patience: 20                         # early stopping epochs
  save_period: 10
  val_period: 1
  deterministic: true
  seed: 42

evaluation:
  conf_threshold: 0.25
  iou_threshold: 0.45
  max_det: 100
