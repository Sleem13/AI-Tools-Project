# YOLO26 character detector trained on cropped Egyptian license plates.

model:
  name: yolo26n
  weights: yolo26n.pt
  architecture: yolo26n.yaml
  pretrained: true

data:
  dataset_yaml: data/raw/dataset_Charcters_ready_plates/data.yaml

hyperparameters:
  epochs: 100
  batch: 32
  imgsz: 640
  optimizer: auto
  lr0: 0.01
  lrf: 0.01
  momentum: 0.937
  weight_decay: 0.0005
  warmup_epochs: 3
  box: 7.5
  cls: 0.75
  dfl: 1.5
  hsv_h: 0.01
  hsv_s: 0.35
  hsv_v: 0.25
  degrees: 3.0
  translate: 0.05
  scale: 0.20
  shear: 1.0
  perspective: 0.0002
  flipud: 0.0
  fliplr: 0.0
  mosaic: 0.5
  mixup: 0.0
  copy_paste: 0.0
  patience: 30

training:
  device: 0
  workers: 8
  project: models/character
  name: yolo26_characters
  exist_ok: false
  save_period: -1
  deterministic: true
  seed: 42
  plots: true
  cache: false
  amp: true
