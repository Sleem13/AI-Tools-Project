# RF-DETR stage-three Egyptian character detector fine-tuning.
# Use an Object Detection dataset where every visible character is labeled
# with its own bounding box and class, e.g. Arabic letters plus digits.

data:
  source_yaml: data/raw/dataset_Charcters_ready_plates/data.yaml
  coco_dir: data/processed/Characters_RFDETR

model:
  # Leave empty to use the package default COCO-pretrained RF-DETR-B checkpoint.
  pretrain_weights:

training:
  output_dir: models/rfdetr/character
  epochs: 50
  batch_size: 4
  grad_accum_steps: 4
  lr: 0.0001
  lr_encoder:
  resolution: 672
  weight_decay: 0.0001
  device: cuda
  use_ema: true
  gradient_checkpointing: true
  checkpoint_interval: 5
  tensorboard: true
  wandb: false
  early_stopping: true
  early_stopping_patience: 12
  early_stopping_min_delta: 0.001
