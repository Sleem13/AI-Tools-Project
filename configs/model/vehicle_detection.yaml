# Optional YOLO11 stage-one vehicle fine-tuning configuration.
# The cascade works immediately with COCO-pretrained yolo11n.pt; train this
# stage only when you have a domain-specific vehicle dataset.

model:
  name: yolo11n
  weights: yolo11n.pt
  architecture: yolo11n.yaml
  pretrained: true

data:
  dataset_yaml: configs/model/vehicle_dataset.yaml
  # Set these to your custom YOLO vehicle split manifests before training.
  train_split: data/vehicle/images/train
  val_split: data/vehicle/images/val
  test_split: data/vehicle/images/test
  names:
    0: car
    1: motorcycle
    2: bus
    3: truck

hyperparameters:
  epochs: 80
  batch: 16
  imgsz: 640
  optimizer: AdamW
  lr0: 0.001
  lrf: 0.01
  momentum: 0.937
  weight_decay: 0.0005
  warmup_epochs: 3
  box: 7.5
  cls: 0.5
  dfl: 1.5
  hsv_h: 0.015
  hsv_s: 0.7
  hsv_v: 0.4
  degrees: 2.0
  translate: 0.1
  scale: 0.5
  shear: 1.0
  perspective: 0.0005
  flipud: 0.0
  fliplr: 0.5
  mosaic: 1.0
  mixup: 0.0
  copy_paste: 0.0
  patience: 20

training:
  device: 0
  workers: 4
  project: models/detection
  name: vehicle_yolo11
  exist_ok: false
  save_period: 10
  deterministic: true
  seed: 42
  plots: true
  cache: false
  amp: true
