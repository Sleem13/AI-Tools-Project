# Raw plate-detection datasets currently present under data/raw.
#
# All three sources use YOLO-normalized bounding boxes. The harmonization
# stage prefixes every output filename with the dataset name, preventing
# collisions while mapping every local class 0 to the shared license-plate
# class.

datasets:
  - name: "egyptian_vehicles"
    root: "data/raw/dataset_Egyptian"
    annotation_format: "yolo"
    image_subdir: "Vehicles"
    annotation_subdir: "Vehicles Labeling"
    class_map:
      0: "license_plate"
    notes: >
      Egyptian vehicle images with a separate YOLO label directory.

  - name: "egyptian_motorcycles"
    root: "data/raw/dataset-Egyptian-motorcycle"
    annotation_format: "yolo"
    image_subdir: null
    annotation_subdir: null
    class_map:
      0: "license_plate"
    notes: >
      Roboflow export with train, valid, and test image/label directories.

unified_class_map:
  0: "license_plate"

# data/raw/dataset_non_Egyptian is intentionally excluded from the default
# target-domain run. Its 10k+ images would outnumber the Egyptian sources by
# roughly 3:1. Add it as a third YOLO source for a separate generalization
# experiment, not for the primary Egyptian benchmark.
