dataset:

  raw_path: data/raw

  processed_path: data/processed

  reports_path: reports

  train_split: 0.8

  validation_split: 0.1

  test_split: 0.1

  random_seed: 42

preprocessing:

  resize:
    enabled: true
    width: 640
    height: 640

  clahe: true

  normalize: true

  denoise: true

quality:

  remove_duplicates: true

  remove_corrupted: true

  remove_empty: true